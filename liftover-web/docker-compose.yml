# 完整服务定义见同目录 service.yml（build context 锚定该文件所在目录）。
#
# 两种入口都能构建、启动同一个应用：
#   1) 进入本目录直接运行：docker compose up -d --build
#      （项目目录即本目录，include 取默认相对路径 service.yml）
#   2) 在外层目录以本文件启动（项目目录是上一级）：
#      docker compose -f liftover-web/docker-compose.yml up -d --build
#      此时由外层已提交的 .env 将 LIFTOVER_WEB_INCLUDE 覆盖为
#      liftover-web/service.yml，include 仍能定位到本片段。
#
# 需要 Docker Compose v2.20+（include 支持）。
include:
  - ${LIFTOVER_WEB_INCLUDE:-service.yml}
